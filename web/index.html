<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Feature Matrix Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Linux DSA</p>
      <h1>Feature Matrix Explorer</h1>
      <p class="subtitle">
        Browser-only viewer for <strong>dsa_feature_matrix.csv</strong> and
        <strong>dsa_driver_chip_list.csv</strong>.
      </p>
      <div id="meta" class="meta"></div>
    </header>

    <section class="controls" aria-label="Matrix controls">
      <div class="control-group">
        <label for="dataset-select">Dataset version</label>
        <select id="dataset-select" aria-describedby="dataset-help"></select>
        <p id="dataset-help" class="help">Choose which generated matrix/chip-list pair to load.</p>
      </div>
      <div class="control-group">
        <label for="feature-search">Feature search</label>
        <input id="feature-search" type="search" placeholder="Type e.g. port_mirror_add">
      </div>
      <div class="control-group">
        <label for="feature-select">Features (match all selected)</label>
        <select id="feature-select" multiple size="8" aria-describedby="feature-help"></select>
        <p id="feature-help" class="help">Ctrl/Cmd+Click to select multiple features.</p>
      </div>
      <div class="control-actions">
        <button id="clear-filters" type="button">Clear filters</button>
      </div>
      <div class="stats" id="stats"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="table-wrap" aria-label="DSA matrix table">
      <table id="matrix-table">
        <thead id="matrix-head"></thead>
        <tbody id="matrix-body"></tbody>
      </table>
    </section>
  </main>

  <template id="chip-template">
    <span class="chip"></span>
  </template>

  <script src="main.js" defer></script>
</body>
</html>
